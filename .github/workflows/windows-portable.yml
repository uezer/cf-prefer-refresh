name: Windows portable

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.4"
          cache: true

      - name: Build Windows release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter config --enable-windows-desktop --no-analytics
          flutter pub get
          flutter build windows --release

      - name: Package portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path . -Recurse -Filter 'cf_prefer_refresh.exe' -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '[\\/]Release[\\/]' } |
            Select-Object -First 1
          if (-not $exe) {
            Write-Host '=== exe search ==='
            Get-ChildItem -Path . -Recurse -Filter '*.exe' -ErrorAction SilentlyContinue |
              ForEach-Object { $_.FullName }
            throw 'cf_prefer_refresh.exe not found after Windows build'
          }
          $rel = $exe.Directory.FullName
          Write-Host "Packaging from $rel"
          Get-ChildItem $rel | Format-Table Name, Length
          $name = 'CFPreferRefresh-1.0.0-windows-x64-portable'
          if (Test-Path $name) { Remove-Item -Recurse -Force $name }
          New-Item -ItemType Directory -Force -Path $name | Out-Null
          Copy-Item -Recurse -Force (Join-Path $rel '*') (Join-Path (Get-Location) $name)
          if (-not (Test-Path (Join-Path $name 'cf_prefer_refresh.exe'))) {
            throw 'exe missing after copy'
          }
          # Avoid Chinese literals in this script (pwsh 5.1 + GHA encoding).
          $usageName = [Text.Encoding]::UTF8.GetString([byte[]](0xE4,0xBD,0xBF,0xE7,0x94,0xA8,0xE8,0xAF,0xB4,0xE6,0x98,0x8E)) + '.txt'
          $readmeSrc = $null
          foreach ($c in @('packaging\windows-usage.txt', 'packaging\README-windows.txt')) {
            if (Test-Path $c) { $readmeSrc = $c; break }
          }
          if (-not $readmeSrc) {
            $readmeSrc = Get-ChildItem -Path packaging -File -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $readmeSrc) { throw 'packaging readme missing' }
          Copy-Item -Force $readmeSrc (Join-Path $name $usageName)
          Copy-Item -Force $readmeSrc (Join-Path $name 'README.txt')
          if (Test-Path "$name.zip") { Remove-Item -Force "$name.zip" }
          # tar.exe handles UTF-8 names; Compress-Archive on Windows PowerShell 5.1 often does not.
          & tar.exe -a -cf "$name.zip" $name
          if (-not (Test-Path "$name.zip")) { throw 'zip not created' }
          Get-Item "$name.zip" | Format-List FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: CFPreferRefresh-1.0.0-windows-x64-portable.zip

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-windows
          name: CF Prefer Refresh 1.0.0 Windows portable
          files: CFPreferRefresh-1.0.0-windows-x64-portable.zip
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            Portable Windows x64. Extract the folder and double-click cf_prefer_refresh.exe.
            Keep data\ and lib\ next to the exe. Clash keeps your Cloudflare edgetunnel URL.
            Tokens are not bundled; paste them in Settings on first run.
