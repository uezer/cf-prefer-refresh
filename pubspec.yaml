name: cf_prefer_refresh
description: 本机测速 Cloudflare 入口 IP，并上传给 edgetunnel 优选列表。Clash 继续使用同一条 CF 订阅。
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2
  yaml: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fallback_ips.txt
